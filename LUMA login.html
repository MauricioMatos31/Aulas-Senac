<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content = "width = device = width, initial-scale = 1.0">
        <title>Login - LUMA </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="login">
                <div class="login_card">
                    <div class="alien">
                        <div class="alien_brilho"></div>
                        <img src="alien login.png" alt="alien logo">
                    </div>
                    <form onsubmit="event.preventDefault();">
                        <div class="input">
                            <span>
                                <img src="alien email.png" alt="alien email logo">
                            </span>
                            <input type="email" placeholder="EMAIL" required>
                        </div>
                        <div class="input">
                            <span>
                                <img src="cadeado.png" alt="senha logo">
                            </span>
                            <input type="password" placeholder="SENHA" required>
                        </div>

                        <div class="opçoes">
                            <label class="lembre_de_mim">
                                <input type="checkbox">
                                Lembre de mim
                            </label>
                            <a href="recuperarSenha1.html" class="Esqueci" >Esqueci minha senha</a>
                            
                            
                        </div>

                        <button type="submit" class="botao_login"> ENTRAR</button>

                        <div class="botao_sociais">
                            <button type="button" class="botao_sociais">
                                  <span>
                                    <img src="google.png" alt="google logo">
                                </span>
                                <strong>GOOGLE</strong>
                            </button>
                        </div>
                        <div class="cadastro">
                            Novo Cliente? <a href="#">Cadastre-se</a>

                        </div>
                    </form>
                </div>
            </div>
            <div class="carrossel-1">
                <div class="carrossel-2">
                    <img src="headset1.png" alt="headhset gamer">
                    <img src="mouse1.png" alt="mouse gamer">
                    <img src="setup.png" alt="setup">

            </div>

        </div>
    </body>
</html>
